name = "mancardo"
main = "worker-private-library-integrity.js"
compatibility_date = "2026-10-02"
preview_urls = true
previews = { }

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

# Private My Library cloud sync requires two Cloudflare-side resources before
# uploads can be enabled safely:
# 1. D1 database, migrated with migrations/0001_private_library.sql
# 2. Cloudflare Access protection for /api/private-library/* using one-time PIN
#    or another approved identity provider.
#
# Once the D1 database is created, add the real binding below:
# [[d1_databases]]
# binding = "PRIVATE_LIBRARY_DB"
# database_name = "mancardo-private-library"
# database_id = "<REAL_D1_DATABASE_ID>"
#
# Configure Worker variables in Cloudflare:
# CF_ACCESS_TEAM_DOMAIN = "<your-team>.cloudflareaccess.com"
# CF_ACCESS_AUD = "<Access application AUD tag>"

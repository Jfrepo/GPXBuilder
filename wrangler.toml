name = "mancardo"
main = "worker-private-library-integrity.js"
compatibility_date = "2026-10-02"
preview_urls = true
previews = { }

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "PRIVATE_LIBRARY_DB"
database_name = "mancardo-private-library"
database_id = "6ada726b-aae6-441b-a698-69dc0789c7b7"

# Private My Library cloud sync also requires Cloudflare Access protection for
# /api/private-library/* using one-time PIN or another approved identity provider.
# Configure Worker variables in Cloudflare:
# CF_ACCESS_TEAM_DOMAIN = "<your-team>.cloudflareaccess.com"
# CF_ACCESS_AUD = "<Access application AUD tag>"

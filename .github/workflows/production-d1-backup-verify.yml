name: Verify Production D1 Backup (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 15
    steps:
      - name: Verify production backup without writing to production
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN" && test -n "$CF_ACCOUNT"
          PROD_DB="6ada726b-aae6-441b-a698-69dc0789c7b7"
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/d1/database/$PROD_DB"
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $CF_TOKEN" "$api" > metadata.json
          node -e 'const r=require("./metadata.json");if(!r.success||r.result?.name!=="mancardo-private-library")process.exit(1);console.log("Verified Production D1 identity (read-only)")'
          # D1 Time Travel info: GET-only. A successful request does not prove a restore.
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $CF_TOKEN" "$api/time_travel/bookmark" > bookmark.json
          node -e 'const r=require("./bookmark.json");if(!r.success||!r.result)process.exit(1);console.log("D1 Time Travel bookmark API responded; recoverability still requires isolated restore")'

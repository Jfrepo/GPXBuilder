name: Initialise Mancardo Development D1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mancardo-dev-database
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mancardo-dev
          persist-credentials: false

      - name: Validate target and migration files
        env:
          DEV_DB: ${{ secrets.CLOUDFLARE_DEV_D1_DATABASE_ID }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CF_ACCOUNT" && test -n "$CF_TOKEN" && test -n "$DEV_DB"
          [[ "$DEV_DB" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "::error::Invalid development database ID"; exit 1; }
          test "${DEV_DB,,}" != "6ada726b-aae6-441b-a698-69dc0789c7b7" || { echo "::error::Production D1 ID is forbidden"; exit 1; }
          test "$(git branch --show-current)" = "mancardo-dev" || { echo "::error::Expected mancardo-dev branch"; exit 1; }
          for f in migrations/0001_private_library.sql migrations/0002_shared_library.sql migrations/0004_private_waypoints.sql migrations/0005_shared_waypoints.sql; do test -s "$f"; done
          response=$(curl --fail-with-body --silent --show-error --retry 2 \
            -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/d1/database/$DEV_DB")
          DB_RESPONSE="$response" node -e '
            const r=JSON.parse(process.env.DB_RESPONSE);
            if(!r.success || r.result?.name!=="mancardo-private-library-dev") {
              console.error("::error::Database identity verification failed: expected mancardo-private-library-dev");
              process.exit(1);
            }
            console.log("Verified dedicated development D1 database name");
          '

      - name: Apply additive migrations to verified development D1 only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEV_DB: ${{ secrets.CLOUDFLARE_DEV_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          for f in \
            migrations/0001_private_library.sql \
            migrations/0002_shared_library.sql \
            migrations/0004_private_waypoints.sql \
            migrations/0005_shared_waypoints.sql; do
            echo "Applying $f to verified development database"
            npx --yes wrangler@4 d1 execute "$DEV_DB" --remote --file="$f"
          done

      - name: Verify required tables exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEV_DB: ${{ secrets.CLOUDFLARE_DEV_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute "$DEV_DB" --remote --command="SELECT name FROM sqlite_master WHERE type='table' AND name IN ('private_library_tracks','private_library_revisions','shared_library_tracks','shared_library_versions','private_library_waypoints','private_library_waypoint_revisions','shared_library_waypoints') ORDER BY name;"

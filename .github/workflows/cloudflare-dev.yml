name: Deploy Mancardo Development Worker

on:
  push:
    branches: [mancardo-dev, 'release/accelerated-stability-20261016']
    # Publishing only this staging preparation must not deploy the branch runtime.
    paths-ignore:
      - '.github/workflows/cloudflare-dev.yml'
      - 'scripts/release-waypoint-alignment-development.cjs'
      - 'tests/waypoint-alignment-development.test.cjs'
      - 'scripts/release-map-performance-development.cjs'
      - 'tests/map-performance-development.test.cjs'
      - 'scripts/trace-map-performance-development.cjs'
      - 'scripts/diagnose-fuel-delivery.cjs'
      - 'tests/fuel-delivery-diagnostic.test.cjs'
      - 'scripts/fuel-provider/**'
      - 'tests/fuel-provider-diagnostic.test.cjs'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Read-only timing diagnosis or explicit candidate staging'
        type: choice
        required: true
        default: diagnose
        options:
          - diagnose
          - fuel-delivery
          - fuel-provider
          - stage
          - verify
      measurement:
        description: 'Bounded fresh-context diagnosis; causal sampling starts before navigation'
        type: choice
        required: true
        default: repeatability
        options:
          - repeatability
          - profile
          - causal

permissions:
  contents: read

concurrency:
  group: mancardo-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/mancardo-dev' || github.ref == 'refs/heads/release/accelerated-stability-20261016')
    environment: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run release safety regression checks
        run: node --test tests/release-safety.test.cjs
      - name: Validate isolated development credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEV_DB: ${{ secrets.CLOUDFLARE_DEV_D1_DATABASE_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Add CLOUDFLARE_API_TOKEN to development environment"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Add CLOUDFLARE_ACCOUNT_ID to development environment"; exit 1; }
          test -n "$DEV_DB" || { echo "::error::Create separate D1 dev database and add CLOUDFLARE_DEV_D1_DATABASE_ID"; exit 1; }
          test "$DEV_DB" != "6ada726b-aae6-441b-a698-69dc0789c7b7" || { echo "::error::Refusing to bind production D1 database to development"; exit 1; }
      - name: Inject dedicated development D1 binding
        env:
          DEV_DB: ${{ secrets.CLOUDFLARE_DEV_D1_DATABASE_ID }}
        run: |
          node -e 'const fs=require("fs"); const id=process.env.DEV_DB; if(!/^[0-9a-f-]{36}$/i.test(id))process.exit(1); const p="wrangler.dev.toml";fs.writeFileSync(p,fs.readFileSync(p,"utf8").replace("DEV_DATABASE_ID_REQUIRED",id))'
      - name: Verify exact Development deployment target
        run: |
          node -e 'const fs=require("fs");const t=fs.readFileSync("wrangler.dev.toml","utf8");if(!/^name = "mancardo-dev-test"$/m.test(t)||!/^database_name = "mancardo-private-library-dev"$/m.test(t)||/DEV_DATABASE_ID_REQUIRED/.test(t)||t.includes("6ada726b-aae6-441b-a698-69dc0789c7b7"))process.exit(1);console.log("Confirmed isolated Development Worker and D1 configuration")'
      - name: Deploy development Worker
        run: npx --yes wrangler@4 deploy --config wrangler.dev.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-performance-candidate:
    # Manual staging of one reviewed candidate; branch runtime is never deployed.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/mancardo-dev' && (inputs.operation == 'stage' || inputs.operation == 'verify')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: development
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.operation == 'verify' && '6ac8fb56f3b74b1a2c96b187cc19d64442944e66' || '637af20b858659d8942cfcc1fc51050070cccb8f' }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release-controller guards
        run: node --test controller/tests/map-performance-development.test.cjs
      - name: Build immutable qualified candidate
        if: inputs.operation == 'stage'
        working-directory: candidate
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium
          test "$(git rev-parse HEAD)" = "637af20b858659d8942cfcc1fc51050070cccb8f"
          npm run test:source
          npm run test:packaged-server
          npm run test:browser
          npm run test:waypoints
          npm run test:map-performance
          npm run test:cancel
          node --test tests/fuel-cache.test.cjs tests/waypoint-development-release.test.cjs
          node scripts/build-waypoint-development.cjs
      - name: Prepare existing-version acceptance dependencies and exact package
        if: inputs.operation == 'verify'
        working-directory: candidate
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium
          test "$(git rev-parse HEAD)" = "6ac8fb56f3b74b1a2c96b187cc19d64442944e66"
          node scripts/build-waypoint-development.cjs
      - name: Verify isolation, stage exact candidate, and verify version and synthetic acceptance
        env:
          CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          EVIDENCE_PATH: ${{ github.workspace }}/performance-development-result.json
          VERIFY_ONLY: ${{ inputs.operation == 'verify' }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEV_DB: ${{ secrets.CLOUDFLARE_DEV_D1_DATABASE_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: node controller/scripts/release-map-performance-development.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-development-result-${{ github.run_id }}
          path: performance-development-result.json
          if-no-files-found: warn
          retention-days: 7

  diagnose-performance:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/mancardo-dev' && inputs.operation == 'diagnose'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: development
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 6ac8fb56f3b74b1a2c96b187cc19d64442944e66
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify diagnostic and staging guards
        run: node --test controller/tests/map-performance-development.test.cjs
      - name: Install browser dependencies only
        working-directory: candidate
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium
      - name: Trace existing Development candidate with synthetic state only
        env:
          CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          PERFORMANCE_DIAGNOSTIC_MODE: ${{ inputs.measurement }}
          PERFORMANCE_LIVE_EVIDENCE: ${{ github.workspace }}/performance-diagnostic.json
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: node controller/scripts/trace-map-performance-development.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-diagnostic-${{ github.run_id }}
          path: performance-diagnostic.json
          if-no-files-found: warn
          retention-days: 7

  diagnose-fuel-delivery:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/mancardo-dev' && inputs.operation == 'fuel-delivery'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: development
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 6ac8fb56f3b74b1a2c96b187cc19d64442944e66
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify diagnostic guards
        run: node --test controller/tests/fuel-delivery-diagnostic.test.cjs controller/tests/map-performance-development.test.cjs
      - name: Read exact Development version and served Fuel bytes only
        env:
          CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          EVIDENCE_PATH: ${{ github.workspace }}/fuel-delivery-diagnostic.json
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: node controller/scripts/diagnose-fuel-delivery.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuel-delivery-diagnostic-${{ github.run_id }}
          path: fuel-delivery-diagnostic.json
          if-no-files-found: warn
          retention-days: 7

  diagnose-fuel-provider:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/mancardo-dev' && inputs.operation == 'fuel-provider'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: development
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 637af20b858659d8942cfcc1fc51050070cccb8f
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare pinned candidate and isolated browser fixtures
        working-directory: candidate
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium
          test "$(git rev-parse HEAD)" = "637af20b858659d8942cfcc1fc51050070cccb8f"
          node scripts/build-waypoint-development.cjs
      - name: Verify diagnostic guards and intercepted browser fixtures
        env:
          CANDIDATE_ROOT: ${{ github.workspace }}/candidate
        run: node --test controller/tests/fuel-provider-diagnostic.test.cjs controller/tests/map-performance-development.test.cjs controller/tests/fuel-delivery-diagnostic.test.cjs controller/tests/release-safety.test.cjs
      - name: Observe one bounded Sydney Fuel attempt without deployment
        env:
          CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          CONTROLLER_ROOT: ${{ github.workspace }}/controller
          FUEL_DIAGNOSTIC_EVIDENCE: ${{ github.workspace }}/fuel-provider-diagnostic.json
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEV_DB: ${{ secrets.CLOUDFLARE_DEV_D1_DATABASE_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: node controller/scripts/fuel-provider/run.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuel-provider-diagnostic-${{ github.run_id }}
          path: fuel-provider-diagnostic.json
          if-no-files-found: warn
          retention-days: 7

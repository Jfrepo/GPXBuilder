name: Deploy Mancardo Development Worker

on:
  push:
    branches: [mancardo-dev, 'release/accelerated-stability-20261016']
    # Publishing only this staging preparation must not deploy the branch runtime.
    paths-ignore:
      - '.github/workflows/cloudflare-dev.yml'
      - 'scripts/release-waypoint-alignment-development.cjs'
      - 'tests/waypoint-alignment-development.test.cjs'
      - 'scripts/release-map-performance-development.cjs'
      - 'tests/map-performance-development.test.cjs'
      - 'scripts/trace-map-performance-development.cjs'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Read-only timing diagnosis or explicit candidate staging'
        type: choice
        required: true
        default: diagnose
        options:
          - diagnose
          - stage
      measurement:
        description: 'Bounded fresh-context diagnosis; causal sampling starts before navigation'
        type: choice
        required: true
        default: repeatability
        options:
          - repeatability
          - profile
          - causal

permissions:
  contents: read

concurrency:
  group: mancardo-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/mancardo-dev') || github.ref == 'refs/heads/release/accelerated-stability-20261016'
    environment: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run release safety regression checks
        run: node --test tests/release-safety.test.cjs
      - name: Validate isolated development credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEV_DB: ${{ secrets.CLOUDFLARE_DEV_D1_DATABASE_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Add CLOUDFLARE_API_TOKEN to development environment"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Add CLOUDFLARE_ACCOUNT_ID to development environment"; exit 1; }
          test -n "$DEV_DB" || { echo "::error::Create separate D1 dev database and add CLOUDFLARE_DEV_D1_DATABASE_ID"; exit 1; }
          test "$DEV_DB" != "6ada726b-aae6-441b-a698-69dc0789c7b7" || { echo "::error::Refusing to bind production D1 database to development"; exit 1; }
      - name: Inject dedicated development D1 binding
        env:
          DEV_DB: ${{ secrets.CLOUDFLARE_DEV_D1_DATABASE_ID }}
        run: |
          node -e 'const fs=require("fs"); const id=process.env.DEV_DB; if(!/^[0-9a-f-]{36}$/i.test(id))process.exit(1); const p="wrangler.dev.toml";fs.writeFileSync(p,fs.readFileSync(p,"utf8").replace("DEV_DATABASE_ID_REQUIRED",id))'
      - name: Verify exact Development deployment target
        run: |
          node -e 'const fs=require("fs");const t=fs.readFileSync("wrangler.dev.toml","utf8");if(!/^name = "mancardo-dev-test"$/m.test(t)||!/^database_name = "mancardo-private-library-dev"$/m.test(t)||/DEV_DATABASE_ID_REQUIRED/.test(t)||t.includes("6ada726b-aae6-441b-a698-69dc0789c7b7"))process.exit(1);console.log("Confirmed isolated Development Worker and D1 configuration")'
      - name: Deploy development Worker
        run: npx --yes wrangler@4 deploy --config wrangler.dev.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-performance-candidate:
    # Manual staging of one reviewed candidate; branch runtime is never deployed.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/mancardo-dev' && inputs.operation == 'stage'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: development
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: df14bd9da7f90a4f18e4e015269ff794985af61b
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release-controller guards
        run: node --test controller/tests/map-performance-development.test.cjs
      - name: Build immutable qualified candidate
        working-directory: candidate
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium
          node scripts/build-waypoint-development.cjs
      - name: Verify isolation, stage exact candidate, and verify version and synthetic acceptance
        env:
          CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          EVIDENCE_PATH: ${{ github.workspace }}/performance-development-result.json
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEV_DB: ${{ secrets.CLOUDFLARE_DEV_D1_DATABASE_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: node controller/scripts/release-map-performance-development.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-development-result-${{ github.run_id }}
          path: performance-development-result.json
          if-no-files-found: warn
          retention-days: 7

  diagnose-performance:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/mancardo-dev' && inputs.operation == 'diagnose'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: development
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: df14bd9da7f90a4f18e4e015269ff794985af61b
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify diagnostic and staging guards
        run: node --test controller/tests/map-performance-development.test.cjs
      - name: Install browser dependencies only
        working-directory: candidate
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium
      - name: Trace existing Development candidate with synthetic state only
        env:
          CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          PERFORMANCE_DIAGNOSTIC_MODE: ${{ inputs.measurement }}
          PERFORMANCE_LIVE_EVIDENCE: ${{ github.workspace }}/performance-diagnostic.json
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: node controller/scripts/trace-map-performance-development.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-diagnostic-${{ github.run_id }}
          path: performance-diagnostic.json
          if-no-files-found: warn
          retention-days: 7

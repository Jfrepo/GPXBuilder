name: Waypoint Export Candidate Qualification
on:
  push:
    branches: ['staging/waypoint-export-development']
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e1c63a4c86ca89f5831bcc0a3ddd6ba70b0d7ade
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps chromium
      - name: Qualify exact candidate with synthetic tests only
        run: |
          test "$(git rev-parse HEAD)" = "e1c63a4c86ca89f5831bcc0a3ddd6ba70b0d7ade"
          npm run test:source
          npm run test:packaged-server
          npm run test:browser
          npm run test:waypoints
          npm run test:waypoint-export
          npm run test:map-performance
          npm run test:cancel
          node --test tests/insert-track-point.test.cjs
          node --test tests/fuel-disabled.test.cjs
          node --test tests/waypoint-development-release.test.cjs
          node scripts/build-waypoint-development.cjs
          echo "ee4ea247ea394f2a1582110f0eeacbfadc07ba4cf0c374899b613fb7d558fa76  dist/waypoint-development/manifest.json" | sha256sum --check
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: waypoint-export-development-e1c63a4c86ca89f5831bcc0a3ddd6ba70b0d7ade
          path: dist/waypoint-development/
          if-no-files-found: error
          retention-days: 7

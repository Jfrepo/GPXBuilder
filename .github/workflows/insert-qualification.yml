name: Waypoint Export Candidate Qualification
on:
  push:
    branches: ['staging/unified-export-qualification']
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dd8b591e1f688559335d28ebedaf196ddac7fe6f
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps chromium
      - name: Qualify exact candidate with synthetic tests only
        run: |
          test "$(git rev-parse HEAD)" = "dd8b591e1f688559335d28ebedaf196ddac7fe6f"
          npm run test:source
          npm run test:packaged-server
          npm run test:browser
          npm run test:waypoints
          npm run test:waypoint-export
          npm run test:waypoint-export-bundled
          npm run test:map-performance
          npm run test:cancel
          node --test tests/insert-track-point.test.cjs
          node --test tests/fuel-disabled.test.cjs
          node --test tests/waypoint-development-release.test.cjs
          node scripts/build-waypoint-development.cjs
          echo "161f2078e476aa1f86ad8f3d206f194408251b56212d99ec1ae32fcc77218cb2  dist/waypoint-development/manifest.json" | sha256sum --check
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: waypoint-export-development-dd8b591e1f688559335d28ebedaf196ddac7fe6f
          path: dist/waypoint-development/
          if-no-files-found: error
          retention-days: 7
